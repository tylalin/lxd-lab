---

- name: Discover lxdbr0 subnet
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read lxdbr0 ipv4.address (CIDR)
      ansible.builtin.command: /snap/bin/lxc network get lxdbr0 ipv4.address
      register: _lxdbr0_raw
      changed_when: false

    - name: Compute network/prefix
      ansible.builtin.set_fact:
        lxdbr0_network: "{{ _lxdbr0_raw.stdout | trim | ansible.utils.ipaddr('network/prefix') }}"

- name: Compute per-host addresses from lxdbr0 subnet
  hosts: all
  connection: local
  gather_facts: false
  tasks:
    - name: Derive ansible_host from lxdbr0 network + host_index
      ansible.builtin.set_fact:
        ansible_host: >-
          {{ hostvars['localhost'].lxdbr0_network
             | ansible.utils.ipaddr(host_index)
             | ansible.utils.ipaddr('address') }}

- name: Manage LXD lab
  hosts: all
  connection: local
  gather_facts: false
  roles:
    - lxd_manage

- name: Configure /etc/hosts for DNS name resolution
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 180
      become: false

    - name: Render /etc/hosts from template to remote target(s)
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} - Generated by Ansible play: {{ ansible_play_name }}"
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host | default(hostvars[host].inventory_hostname) }} {{ host }} {{ host }}.{{ domain }}
          {% endfor %}
        create: true
        mode: "0644"

- name: Configure SSH CA
  hosts: localhost
  gather_facts: false
  become: true
  become_user: "{{ user }}"
  tasks:
    - name: Ensure CA key directory exists
      ansible.builtin.file:
        path: "{{ ssh_ca_dir }}"
        state: directory
        mode: "0700"

    - name: Generate SSH RSA key pair for CA if not present
      community.crypto.openssh_keypair:
        path: "{{ ssh_ca_dir }}/{{ ssh_ca_key_name }}"
        comment: "{{ ssh_ca_key_comment }}"

    - name: Create directory structure for all hosts
      ansible.builtin.file:
        path: "{{ ssh_ca_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ groups['all'] }}"

    - name: Cleanup SSH CA directory upon destroy
      ansible.builtin.file:
        path: "{{ ssh_ca_dir }}"
        state: absent
      tags: [destroy, never]

- name: Configure server-side for SSH certificate authentication
  hosts: servers
  gather_facts: false
  tasks:
    - name: Get ssh_host_rsa_key.pub from server
      ansible.builtin.fetch:
        src: "/etc/ssh/{{ host_key_name }}.pub"
        dest: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/"
        flat: true

    - name: Copy CA public key to server
      ansible.builtin.copy:
        src: "{{ ssh_ca_dir }}/{{ ssh_ca_key_name }}.pub"
        dest: "/etc/ssh/"
        mode: "0644"

    - name: Sign SSH host key with CA private key
      ansible.builtin.command: |
        ssh-keygen -s {{ ssh_ca_key_name }}
                   -I {{ inventory_hostname }}
                   -V +52w
                   -h
                   -n {{ inventory_hostname }}.{{ domain }}
                   {{ inventory_hostname }}/{{ host_key_name }}.pub
      args:
        chdir: "{{ ssh_ca_dir }}"
        creates: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/{{ host_crtkey }}"
      delegate_to: localhost
      become: true
      become_user: "{{ user }}"

    - name: Copy signed host public key to server
      ansible.builtin.copy:
        src: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/{{ host_crtkey }}"
        dest: "/etc/ssh/"
        mode: "0644"

    - name: Ensure SSH CA settings are in sshd_config
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          HostKey /etc/ssh/{{ host_key_name }}
          HostCertificate /etc/ssh/{{ host_crtkey }}
          TrustedUserCAKeys /etc/ssh/{{ ssh_ca_key_name }}.pub
        marker: "# {mark} ANSIBLE MANAGED SSH CA CONFIG"
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
        daemon_reload: true

- name: Configure client-side for SSH certificate authentication
  hosts: clients
  gather_facts: false
  tasks:
    - name: Ensure .ssh directory exists for {{ user }}
      ansible.builtin.file:
        path: "/home/{{ user }}/.ssh"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0700"

    - name: Generate SSH RSA key pair for {{ user }} if not present
      community.crypto.openssh_keypair:
        path: "/home/{{ user }}/.ssh/{{ user_key_name }}"
        owner: "{{ user }}"
        group: "{{ user }}"
        comment: "{{ user }}@{{ inventory_hostname }}"

    - name: Get {{ user_key_name }}.pub from client
      ansible.builtin.fetch:
        src: "/home/{{ user }}/.ssh/{{ user_key_name }}.pub"
        dest: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/"
        flat: true

    - name: Sign SSH user key with CA private key
      ansible.builtin.command: |
        ssh-keygen -s {{ ssh_ca_key_name }}
                   -I {{ inventory_hostname }}
                   -V +52w
                   -n {{ user }}
                   {{ inventory_hostname }}/{{ user_key_name }}.pub
      args:
        chdir: "{{ ssh_ca_dir }}"
        creates: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/{{ user_crtkey }}"
      delegate_to: localhost
      become: true
      become_user: "{{ user }}"

    - name: Copy signed user public key to client
      ansible.builtin.copy:
        src: "{{ ssh_ca_dir }}/{{ inventory_hostname }}/{{ user_crtkey }}"
        dest: "/home/{{ user }}/.ssh/"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    - name: Ensure CA public key is present in ssh_known_hosts
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_known_hosts
        create: true
        line: "@cert-authority *.{{ domain }} {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/ca/homelab_ssh_ca.pub') }}"
        state: present
